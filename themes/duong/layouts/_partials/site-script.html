<script>
  (function () {
    var root = document.documentElement;
    var media = window.matchMedia("(prefers-color-scheme: dark)");

    /* Theme toggle. The saved choice is applied in <head> before first paint. */
    var toggle = document.querySelector("[data-theme-toggle]");
    var themeColors = document.querySelectorAll('meta[name="theme-color"]');
    function current() {
      return root.dataset.theme || (media.matches ? "dark" : "light");
    }
    function sync() {
      var dark = current() === "dark";
      if (toggle) toggle.setAttribute("aria-pressed", dark ? "true" : "false");
      /* Keep the mobile browser chrome in step with a manual choice. */
      themeColors.forEach(function (m) {
        if (root.dataset.theme) m.removeAttribute("media");
        m.setAttribute("content", dark ? "#0c0c0e" : "#fafafa");
      });
    }
    if (toggle) {
      toggle.addEventListener("click", function () {
        var next = current() === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
        sync();
      });
    }
    media.addEventListener("change", sync);
    if (root.dataset.theme) sync(); else if (toggle) toggle.setAttribute("aria-pressed", current() === "dark" ? "true" : "false");

    /* Copy buttons on code blocks. */
    document.addEventListener("click", function (event) {
      var button = event.target.closest("[data-copy]");
      if (!button || !navigator.clipboard) return;
      var code = button.closest(".code-block").querySelector("pre code");
      var label = button.querySelector(".copy-label");
      navigator.clipboard.writeText(code.innerText.replace(/\n$/, "")).then(
        function () { flash(button, label, "Copied", true); },
        function () { flash(button, label, "Copy failed", false); }
      );
    });
    function flash(button, label, text, ok) {
      label.textContent = text;
      button.classList.toggle("is-copied", ok);
      clearTimeout(button._timer);
      button._timer = setTimeout(function () {
        label.textContent = "Copy";
        button.classList.remove("is-copied");
      }, 1800);
    }
  })();
</script>
