{{- $lang := .Type | default "text" -}}
<div class="code-block">
  <div class="code-bar">
    <span class="code-lang">{{ $lang }}</span>
    <button class="copy-btn" type="button" data-copy aria-label="Copy code">
      {{ partial "icons/copy.html" . }}{{ partial "icons/check.html" . }}<span class="copy-label" aria-live="polite">Copy</span>
    </button>
  </div>
  {{ transform.Highlight .Inner $lang .Options }}
</div>
