baseurl: "https://duong.page"
contentdir: content
layoutdir: layouts
publishdir: public
title: Duong
canonifyurls: false
languageCode: en
enableRobotsTXT: true
# lastmod comes from git history (CI checks out with fetch-depth: 0), so sitemap and
# article:modified_time reflect real edits.
enableGitInfo: true
frontmatter:
  lastmod: [":git", "lastmod", ":fileModTime", "date"]

taxonomies:
  tag: tags

outputFormats:
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

outputs:
  home: [html, rss, llms]
  page: [html, markdown]

mediaTypes:
  text/markdown:
    suffixes: [md]

DefaultContentLanguage: en
theme: duong
metaDataFormat: yaml
markup:
  highlight:
    noClasses: false

Params:
  subtitle: Duong's Blog
  homeTitle: Duong Nguyen | Software Engineering Blog
  description: Software engineer writing about technology, simplicity, and lifelong learning.
  logo: img/duong.jpg
  favicon: img/duong.ico
  dateFormat: "January 2, 2006"
  commit: false
  rss: true
  comments: true
  author:
    name: Duong Nguyen
    email: duongnv129@gmail.com
    github: duongnv129
    twitter: duongnv129
    linkedin: duongnv129

menu:
  main:
    - name: Blog
      url: tags/me
      weight: 1
    - name: Technology
      url: tags/tech
      weight: 2
    - name: About
      url: page/about/
      weight: 3
    - name: Tags
      url: tags
      weight: 3
